[package]
name = "dev-idp"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.3"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed"], default-features = false }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime-serde = "1.1.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
notify-debouncer-full = "0.7.0"
rand_chacha = "0.3"
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
yaml_serde = "0.10.7"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"

# RSA key generation from the seed is very slow without optimizations.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
strip = true
lto = true
