<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}dev-idp{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6b7a; --border: #dde1e7;
    --accent: #3b5bdb; --accent-bg: #edf1ff; --warn-bg: #fff4d6; --warn-text: #7a5300; --error: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa4b1; --border: #2f3540;
      --accent: #8ea2ff; --accent-bg: #232a40; --warn-bg: #3a2f12; --warn-text: #f2cc6b; --error: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .banner { background: var(--warn-bg); color: var(--warn-text); text-align: center; padding: 6px 16px; font-weight: 600; font-size: 13px; letter-spacing: .04em; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .user { display: block; width: 100%; text-align: left; background: var(--card); color: inherit; font: inherit;
             border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .user:hover, .user:focus-visible { border-color: var(--accent); background: var(--accent-bg); outline: none; }
  .user strong { display: block; }
  .user span { color: var(--muted); font-size: 13px; }
  .user code { font-size: 12px; color: var(--muted); }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); }
  textarea { width: 100%; min-height: 90px; margin-top: 8px; font: 13px/1.4 ui-monospace, monospace; padding: 8px;
             background: var(--card); color: inherit; border: 1px solid var(--border); border-radius: 8px; }
  .error { color: var(--error); background: var(--card); border: 1px solid var(--error); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 4px 0; vertical-align: top; }
  th { color: var(--muted); font-weight: normal; width: 40%; }
</style>
</head>
<body>
<div class="banner">DEV ONLY · dev-idp issues tokens without authentication</div>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
