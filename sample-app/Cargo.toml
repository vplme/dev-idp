[package]
name = "sample-app"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone, like your own app would be: not part of dev-idp's build.
[workspace]

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
strip = true
